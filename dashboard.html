<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto Swiper Dashboard</title>
  <script src="chart.min.js"></script>
  <style>
    /* ========================================================
       Auto Swiper Dashboard — shares the popup's token system.
       Keep these variables in sync with styles.css :root.
       ======================================================== */
    :root {
      /* shadcn "zinc" light theme — keep in sync with styles.css :root */
      --brand: #18181b;
      --brand-2: #27272a;
      --brand-grad: #18181b;
      --like: #16a34a;
      --pass: #dc2626;
      --match: #18181b;
      --warn: #b45309;
      --info: #3f3f46;
      --accent: #18181b;
      --like-soft: #f0fdf4;
      --like-line: #bbf7d0;
      --pass-soft: #fef2f2;
      --pass-line: #fecaca;
      --bg: #ffffff;
      --bg-2: #fafafa;
      --surface: #ffffff;
      --surface-2: #f4f4f5;
      --surface-3: #e4e4e7;
      --hairline: #e4e4e7;
      --hairline-strong: #d4d4d8;
      --text: #09090b;
      --text-dim: #71717a;
      --text-faint: #a1a1aa;
      --r-sm: 6px;
      --r-md: 8px;
      --r-lg: 12px;
      --r-pill: 999px;
      --shadow-sm: 0 1px 2px rgba(9, 9, 11, 0.05);
      --shadow-md: 0 4px 12px rgba(9, 9, 11, 0.08);
      --glow-brand: 0 1px 2px rgba(9, 9, 11, 0.08);
      --t-fast: 0.15s ease;
      --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font);
      background: var(--bg-2);
      background-attachment: fixed;
      color: var(--text);
      min-height: 100vh;
      padding: 28px;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--hairline);
    }

    .header h1 {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--text);
    }

    .header-actions {
      display: flex;
      gap: 10px;
    }

    .btn {
      padding: 9px 16px;
      border: 1px solid var(--hairline);
      border-radius: var(--r-sm);
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      background: var(--surface);
      color: var(--text);
      transition: background var(--t-fast), border-color var(--t-fast);
    }

    .btn:hover {
      background: var(--surface-2);
    }

    .btn:active {
      transform: scale(0.98);
    }

    /* Primary here = "Reset All" (destructive) — shadcn destructive button */
    .btn-primary {
      background: var(--pass);
      border-color: var(--pass);
      color: #fff;
    }

    .btn-primary:hover {
      background: #b91c1c;
    }

    /* Secondary — outline */
    .btn-secondary {
      background: var(--surface);
      color: var(--text);
    }

    /* Success — outline with subtle green text */
    .btn-success {
      background: var(--surface);
      color: var(--like);
      border-color: var(--like-line);
    }

    .btn-success:hover {
      background: var(--like-soft);
    }

    /* Stats Cards */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .stat-card {
      position: relative;
      background: var(--surface);
      border: 1px solid var(--hairline);
      border-radius: var(--r-lg);
      padding: 22px;
      text-align: center;
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      transition: transform var(--t-fast), border-color var(--t-fast), box-shadow var(--t-fast);
    }

    .stat-card:hover {
      transform: translateY(-3px);
      border-color: var(--hairline-strong);
      box-shadow: var(--shadow-md);
    }

    .stat-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: currentColor;
      opacity: 0.7;
    }

    .stat-card .value {
      font-size: 38px;
      font-weight: 800;
      color: #fff;
      letter-spacing: -1px;
      line-height: 1;
    }

    .stat-card .label {
      font-size: 12px;
      color: var(--text-dim);
      margin-top: 8px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      font-weight: 600;
    }

    .stat-card.likes { color: var(--like); }
    .stat-card.likes .value { color: var(--like); }
    .stat-card.dislikes { color: var(--pass); }
    .stat-card.dislikes .value { color: var(--pass); }
    .stat-card.matches { color: var(--match); }
    .stat-card.matches .value { color: var(--match); }
    .stat-card.streak { color: var(--warn); }
    .stat-card.streak .value { color: var(--warn); }
    .stat-card.sessions { color: var(--accent); }
    .stat-card.sessions .value { color: var(--accent); }

    /* Charts Section */
    .charts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
      gap: 20px;
      margin-bottom: 24px;
    }

    .chart-card {
      background: var(--surface);
      border: 1px solid var(--hairline);
      border-radius: var(--r-lg);
      padding: 22px;
      box-shadow: var(--shadow-sm);
    }

    .chart-card h3 {
      font-size: 15px;
      color: var(--text);
      margin-bottom: 18px;
      font-weight: 700;
    }

    .chart-container {
      position: relative;
      height: 250px;
    }

    /* History Table */
    .history-section {
      background: var(--surface);
      border: 1px solid var(--hairline);
      border-radius: var(--r-lg);
      padding: 22px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-sm);
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .history-header h3 {
      font-size: 17px;
      color: var(--text);
      font-weight: 700;
    }

    .filter-input {
      padding: 9px 14px;
      border: 1px solid var(--hairline-strong);
      border-radius: var(--r-sm);
      background: var(--bg-2);
      color: #fff;
      font-size: 14px;
      width: 220px;
      transition: border-color var(--t-fast), box-shadow var(--t-fast);
    }

    .filter-input:focus {
      outline: none;
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(9, 9, 11, 0.12);
    }

    .history-table {
      width: 100%;
      border-collapse: collapse;
    }

    .history-table th,
    .history-table td {
      padding: 13px 12px;
      text-align: left;
      border-bottom: 1px solid var(--hairline);
    }

    .history-table th {
      font-size: 11px;
      color: var(--text-faint);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      font-weight: 700;
    }

    .history-table td {
      font-size: 14px;
      color: var(--text);
    }

    .history-table tbody tr {
      transition: background var(--t-fast);
    }

    .history-table tbody tr:hover {
      background: var(--surface-2);
    }

    .action-badge {
      padding: 4px 10px;
      border-radius: var(--r-pill);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .action-badge.like {
      background: var(--like-soft);
      border: 1px solid var(--like-line);
      color: var(--like);
    }

    .action-badge.dislike {
      background: var(--pass-soft);
      border: 1px solid var(--pass-line);
      color: var(--pass);
    }

    .site-badge {
      padding: 4px 10px;
      border-radius: var(--r-pill);
      font-size: 11px;
      font-weight: 600;
      border: 1px solid var(--hairline);
    }

    .site-badge.tinder {
      background: var(--surface-2);
      color: var(--text-dim);
    }

    .site-badge.bumble {
      background: var(--surface-2);
      color: var(--text-dim);
    }

    .filter-reason {
      font-size: 11px;
      color: var(--text-dim);
    }

    /* Sessions Section */
    .sessions-section {
      background: var(--surface);
      border: 1px solid var(--hairline);
      border-radius: var(--r-lg);
      padding: 22px;
      box-shadow: var(--shadow-sm);
    }

    .session-card {
      background: var(--surface-2);
      border: 1px solid var(--hairline);
      border-radius: var(--r-md);
      padding: 16px 18px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: transform var(--t-fast), border-color var(--t-fast);
    }

    .session-card:hover {
      transform: translateX(3px);
      border-color: var(--hairline-strong);
    }

    .session-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .session-date {
      font-size: 14px;
      color: #fff;
      font-weight: 600;
    }

    .session-time {
      font-size: 12px;
      color: var(--text-dim);
    }

    .session-stats {
      display: flex;
      gap: 20px;
    }

    .session-stat {
      text-align: center;
    }

    .session-stat .num {
      font-size: 19px;
      font-weight: 800;
    }

    .session-stat .label {
      font-size: 10px;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .session-stat.likes .num { color: var(--like); }
    .session-stat.dislikes .num { color: var(--pass); }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 48px;
      color: var(--text-faint);
    }

    .empty-state p {
      margin-top: 8px;
    }

    /* Pagination */
    .pagination {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 18px;
    }

    .page-btn {
      padding: 8px 14px;
      border: 1px solid var(--hairline-strong);
      border-radius: var(--r-sm);
      background: transparent;
      color: var(--text-dim);
      cursor: pointer;
      font-weight: 600;
      transition: all var(--t-fast);
    }

    .page-btn:hover {
      border-color: var(--brand);
      color: var(--text);
    }

    .page-btn.active {
      background: var(--brand-grad);
      border-color: transparent;
      color: #fff;
    }

    .page-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Auto Swiper Dashboard</h1>
      <div class="header-actions">
        <button class="btn btn-success" id="logMatchBtn">Log Match</button>
        <button class="btn btn-secondary" id="exportJsonBtn">Export JSON</button>
        <button class="btn btn-secondary" id="exportCsvBtn">Export CSV</button>
        <button class="btn btn-primary" id="resetBtn">Reset All</button>
      </div>
    </div>

    <!-- Stats Cards -->
    <div class="stats-grid">
      <div class="stat-card likes">
        <div class="value" id="totalLikes">0</div>
        <div class="label">Total Likes</div>
      </div>
      <div class="stat-card dislikes">
        <div class="value" id="totalDislikes">0</div>
        <div class="label">Total Passes</div>
      </div>
      <div class="stat-card matches">
        <div class="value" id="totalMatches">0</div>
        <div class="label">Matches</div>
      </div>
      <div class="stat-card streak">
        <div class="value" id="streakDays">0</div>
        <div class="label">Day Streak</div>
      </div>
      <div class="stat-card sessions">
        <div class="value" id="totalSessions">0</div>
        <div class="label">Sessions</div>
      </div>
    </div>

    <!-- Charts -->
    <div class="charts-grid">
      <div class="chart-card">
        <h3>Swipe Ratio</h3>
        <div class="chart-container">
          <canvas id="ratioChart"></canvas>
        </div>
      </div>
      <div class="chart-card">
        <h3>Activity (Last 7 Days)</h3>
        <div class="chart-container">
          <canvas id="activityChart"></canvas>
        </div>
      </div>
    </div>

    <!-- Swipe History -->
    <div class="history-section">
      <div class="history-header">
        <h3>Swipe History</h3>
        <input type="text" class="filter-input" id="historyFilter" placeholder="Filter by name...">
      </div>
      <table class="history-table">
        <thead>
          <tr>
            <th>Time</th>
            <th>Name</th>
            <th>Age</th>
            <th>Distance</th>
            <th>Action</th>
            <th>Site</th>
            <th>Filter</th>
          </tr>
        </thead>
        <tbody id="historyBody">
        </tbody>
      </table>
      <div class="pagination" id="pagination"></div>
    </div>

    <!-- Sessions -->
    <div class="sessions-section">
      <h3 style="margin-bottom: 16px; color: #fff;">Recent Sessions</h3>
      <div id="sessionsContainer"></div>
    </div>
  </div>

  <script src="dashboard.js"></script>
</body>
</html>
